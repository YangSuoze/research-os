name: research-os-rewrite

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      # 仅限本地开发：关闭认证与 TLS，匹配 BACKEND_ELASTICSEARCH_URL。
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    depends_on:
      elasticsearch:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # 本地开发默认密码；也可在首次启动前设置 NEO4J_PASSWORD。
      # 已有数据库的密码不会随此变量改变。
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-12345678}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" 'RETURN 1;' > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    stop_grace_period: 1m

volumes:
  elasticsearch_data:
  neo4j_data:
