[project]
name = "research-os-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2",
  "pydantic-settings",
  "elasticsearch[async]>=8,<9",
  "httpx[socks]>=0.28,<1",
  "openai>=2,<3",
]

[project.optional-dependencies]
pdf = ["mineru==4.0.5"]
graph = ["neo4j>=5,<7", "sentence-transformers>=3,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_import_mcp"]
