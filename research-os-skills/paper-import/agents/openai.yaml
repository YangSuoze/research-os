interface:
  display_name: "Paper Import"
  short_description: "Import PDFs and track paper2graph progress"
  default_prompt: "Use $paper-import with paper2graph MCP to import PDFs from <directory> into task_root_id <task> and supervise the batch to completion."
dependencies:
  tools:
    - type: "mcp"
      value: "paper2graph"
      description: "Queue paper imports, inspect batch progress and retry failed papers"
